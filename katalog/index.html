<body class="ic-sayfa katalog-sayfasi">
<header class="ust" id="ust">
  <div class="ust-bar">
    <a class="marka" href="/" aria-label="Şahinkaya Mobilya - ana sayfa"><img src="assets/logo.png" alt="Şahinkaya Mobilya"></a>
    <nav class="menu" id="menu">
      <a href="/renkler/">Renkler</a>
      <a class="one-cikan" href="/modeller/">Modeller</a>
      <a class="etkin" href="/katalog/" aria-current="page">Katalog</a>
      <a href="/iletisim/">İletişim</a>
    </nav>
    <div class="ust-araclar">
      <a class="konfig-link" href="/konfigurator/">Konfigüratör</a>
      <button class="menu-dugmesi" id="menu-dugmesi" type="button" aria-label="Menü" aria-expanded="false" aria-controls="menu">☰</button>
    </div>
  </div>
</header>
<main class="katalog-main">
  <section class="kitap-alani" aria-label="Lake kapak kataloğu">
    <div class="kitap-araclari"><span class="kitap-durum" id="kitap-durum" aria-live="polite">01 - 02 / 20</span><a class="pdf-indir" href="assets/katalog/sahinkaya-lake-kapak-katalogu.pdf" download>PDF indir</a></div>
    <div class="kitap-sahnesi">
      <div class="kitap-golge">
        <div class="kitap" id="kitap" tabindex="0" aria-label="Dijital katalog. Sağ yaprağa tıklayarak ilerleyin, sol yaprağa tıklayarak geri dönün.">
          <button class="kitap-sayfa kitap-sol" id="kitap-sol" type="button" aria-label="Önceki sayfalar"><img id="sol-sayfa-gorsel" src="assets/katalog/sayfa-01.jpg" alt="Katalog sayfası 1"></button>
          <button class="kitap-sayfa kitap-sag" id="kitap-sag" type="button" aria-label="Sonraki sayfalar"><img id="sag-sayfa-gorsel" src="assets/katalog/sayfa-02.jpg" alt="Katalog sayfası 2"></button>
          <div class="ceviren-yaprak" id="ceviren-yaprak" aria-hidden="true">
            <div class="yaprak-yuzu yaprak-on"><img id="yaprak-on-gorsel" src="assets/katalog/sayfa-02.jpg" alt=""></div>
            <div class="yaprak-yuzu yaprak-arka"><img id="yaprak-arka-gorsel" src="assets/katalog/sayfa-03.jpg" alt=""></div>
          </div>
          <span class="kitap-sirti" aria-hidden="true"></span>
        </div>
      </div>
    </div>
    <div class="kitap-kontrolleri" aria-label="Katalog sayfa kontrolleri"><button id="geri" type="button">Geri</button><span id="kitap-ipucu">Sağ yaprağa tıklayarak devam edin</span><button id="ileri" type="button">İleri</button></div>
  </section>
</main>
<script type="module" src="js/katalog.js?v=20260915-2"></script>
</body>
</html>
