<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Şahinkaya Ahşap | Lake Kapak Konfigüratörü</title>
<meta name="description" content="Lake kapaklarınızı 77 RAL renginde, kendi ölçünüzde 3B olarak görün. Şahinkaya Ahşap Mobilya — mobilya, iç mimari, tasarım.">
<link rel="icon" href="assets/mini-logo.png">
<link rel="apple-touch-icon" href="assets/mini-logo.png">
<link rel="stylesheet" href="css/parallaks.css">
</head>
<body>

<!-- Üst bar sabit: galeri 600vh boyunca kaydırılırken de konfigüratöre
     giden yol her an açık kalsın (sayfanın tek işlevsel çıkışı burası). -->
<header class="ana-bar">
    <a href="index.html" class="ana-marka" aria-label="Şahinkaya Ahşap — ana sayfa">
        <img src="assets/logo.png" alt="Şahinkaya Ahşap">
    </a>
    <a href="configurator.html" class="ana-btn ana-btn-birincil">
        Konfigüratörü Aç
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
</header>

<!-- Galeri: kaydırdıkça 3B matris düzleşiyor, dört sütun farklı hızlarda
     kayıyor. Kartlar js/parallaks.js tarafından js/data/galeri.js'ten
     üretiliyor; fotoğraf girilmemişken yerlerini markanın RAL Lake
     paletinden üretilen kapak görselleri tutuyor. -->
<main class="pu-sahne" id="pu-sahne">
    <div class="pu-yapiskan">
        <div class="pu-pano">
            <div class="pu-perspektif">
                <div class="pu-vinyet pu-vinyet-dikey" aria-hidden="true"></div>
                <div class="pu-vinyet pu-vinyet-yatay" aria-hidden="true"></div>
                <div class="pu-matris" id="pu-matris" role="group" aria-label="Kapak galerisi"></div>
            </div>
        </div>
    </div>
</main>

<script type="module" src="js/parallaks.js"></script>
</body>
</html>
