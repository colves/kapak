<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Şahinkaya Ahşap | Kapak Galerisi</title>
<meta name="description" content="Şahinkaya Ahşap Mobilya — lake kapak uygulamalarından kareler.">
<link rel="icon" href="assets/mini-logo.png">
<link rel="apple-touch-icon" href="assets/mini-logo.png">
<link rel="stylesheet" href="css/parallaks.css">
</head>
<body>

<!-- Sayfanın TAMAMI bu galeri: 600vh boyunca kaydırıldıkça içerideki pano
     açılıyor, 3B matris düzleşiyor ve dört sütun farklı hızlarda kayıyor.
     Kartlar js/parallaks.js tarafından js/data/galeri.js'ten üretiliyor;
     fotoğraf girilmemişken yerlerini markanın RAL Lake paletinden üretilen
     kapak görselleri tutuyor. -->
<main class="pu-sahne" id="pu-sahne">
    <div class="pu-yapiskan">
        <div class="pu-pano">
            <div class="pu-perspektif">
                <div class="pu-vinyet pu-vinyet-dikey" aria-hidden="true"></div>
                <div class="pu-vinyet pu-vinyet-yatay" aria-hidden="true"></div>
                <div class="pu-matris" id="pu-matris" role="group" aria-label="Kapak galerisi"></div>
            </div>
        </div>
    </div>
</main>

<script type="module" src="js/parallaks.js"></script>
</body>
</html>
