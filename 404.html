<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, follow">
<title>Sayfa Bulunamadı | Şahinkaya Mobilya</title>
<link rel="icon" href="assets/mini-logo.png">
<link rel="apple-touch-icon" href="assets/mini-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
    :root { --ink: #252321; --paper: #f6f1e9; --accent: #9b6d35; }
    * { box-sizing: border-box; }
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 28px; color: var(--ink); background: radial-gradient(circle at 80% 12%, #d4c1a8, var(--paper) 48%, #ece4d8); font-family: Manrope, sans-serif; }
    main { width: min(760px, 100%); text-align: center; }
    img { width: min(250px, 58vw); height: auto; margin: 0 auto clamp(46px, 9vw, 84px); }
    .code { display: block; margin-bottom: 16px; font: 12px 'DM Mono', monospace; letter-spacing: .18em; color: var(--accent); }
    h1 { margin: 0; font: 600 clamp(42px, 8vw, 84px)/1 'Playfair Display', Georgia, serif; letter-spacing: -.04em; }
    p { max-width: 480px; margin: 22px auto 34px; color: #635d55; font-size: clamp(15px, 2vw, 18px); line-height: 1.65; }
    nav { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    a { display: inline-flex; align-items: center; min-height: 48px; padding: 12px 19px; border: 1px solid var(--ink); border-radius: 4px; color: var(--ink); font-size: 13px; font-weight: 700; text-decoration: none; transition: background-color .2s ease, color .2s ease; }
    a:first-child { color: #fff; background: var(--ink); }
    a:hover { color: #fff; background: var(--accent); border-color: var(--accent); }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
    <img src="assets/logo.png" alt="Şahinkaya Mobilya">
    <span class="code">404 / SAYFA BULUNAMADI</span>
    <h1>Aradığınız sayfayı bulamadık.</h1>
    <p>Bağlantı değişmiş veya yazım hatası yapılmış olabilir. Ana sayfadan devam edebilir ya da kapak modellerini inceleyebilirsiniz.</p>
    <nav aria-label="Sayfa seçenekleri">
        <a href="/">Ana sayfaya dön</a>
        <a href="/modeller/">Kapak modelleri</a>
        <a href="/konfigurator/">Konfigüratör</a>
    </nav>
</main>
</body>
</html>
